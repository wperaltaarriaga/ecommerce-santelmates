<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/imagenes/image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santelmates | Mates artesanales</title>
    <meta name="description" content="Mates, bombillas y accesorios artesanales. Elegí el tuyo y recibilo en tu casa." />
    <meta name="theme-color" content="#ffffff" />

    <!-- Precarga de la foto del hero: el navegador la empieza a bajar junto con el HTML,
         sin esperar a que cargue React. Mismo corte (640px) que en Home.module.css. -->
    <link rel="preload" as="image" type="image/avif" href="/hero/hero-800.avif" media="(max-width: 640px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/avif" href="/hero/hero-1600.avif" media="(min-width: 641px)" fetchpriority="high" />

    <!-- Vista previa al compartir el link (WhatsApp, Instagram, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Santelmates" />
    <meta property="og:title" content="Santelmates | Mates artesanales" />
    <meta property="og:description" content="Mates, bombillas y accesorios artesanales. Elegí el tuyo y recibilo en tu casa." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- aca se monta la app -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
